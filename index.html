<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SymptomCanvas</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#0b1020;
color:white;
min-height:100vh
}

header{
padding:25px 7%;
border-bottom:1px solid #252c42;
display:flex;
justify-content:space-between;
align-items:center
}

.logo{font-size:25px;font-weight:700}
.logo span{color:#6ee7ff}
header p{color:#8992aa}

main{
width:90%;
max-width:1300px;
margin:30px auto
}

.grid{
display:grid;
grid-template-columns:280px 1fr 300px;
gap:20px
}

.card{
background:#131a2d;
border:1px solid #252d44;
border-radius:18px;
padding:20px
}

h2{margin-bottom:15px}
h3{margin-bottom:12px}

.parts button,.tools button{
width:100%;
margin-bottom:9px;
padding:12px;
border:1px solid #303952;
border-radius:10px;
background:#1a2238;
color:white;
cursor:pointer
}

.parts button{text-align:left}

button:hover{background:#27314e}

.parts button.active{
background:#263f55;
border-color:#6ee7ff
}

.legend{
display:grid;
gap:8px;
margin-top:15px
}

.legend div{
padding:8px;
background:#1a2238;
border-radius:8px;
font-size:13px
}

.red{color:#ff4d5e}
.black{color:#ddd}
.blue{color:#61e8ff}
.purple{color:#b27cff}
.yellow{color:#ffd84d}

.canvas-wrapper{
position:relative;
height:600px;
background:#0e1425;
border-radius:15px;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center
}

#bodyCanvas{
background:#10172a;
border:1px solid #252e47;
border-radius:12px;
cursor:crosshair;
max-width:100%;
max-height:100%
}

.tools{
margin-top:15px;
display:grid;
grid-template-columns:repeat(5,1fr);
gap:8px
}

.tools button{
text-align:center;
margin:0
}

.tools button.active{
border-color:#6ee7ff;
background:#24364b
}

label{
display:block;
color:#aeb7cd;
margin:15px 0 7px
}

select,input{
width:100%;
padding:11px;
border-radius:9px;
border:1px solid #303952;
background:#0e1425;
color:white
}

.save-btn{
width:100%;
padding:13px;
margin-top:20px;
border:none;
border-radius:10px;
background:#6ee7ff;
color:#071018;
font-weight:bold;
cursor:pointer
}

.timeline-item{
border-left:3px solid #6ee7ff;
padding:10px 12px;
margin-bottom:15px;
background:#1a2238;
border-radius:0 8px 8px 0
}

.timeline-time{
color:#6ee7ff;
font-weight:bold
}

.summary{
line-height:1.6;
color:#c4cbdc;
font-size:14px
}

.empty{
color:#727c95;
text-align:center;
padding:30px 5px
}

@media(max-width:1000px){
.grid{grid-template-columns:1fr}
.tools{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>

<body>

<header>
<div class="logo">Symptom<span>Canvas</span></div>
<p>Visual symptom tracking</p>
</header>

<main>

<div class="grid">

<section class="card">

<h3>Область тела</h3>

<div class="parts">

<button class="active" onclick="selectPart('Голова',this)">🧠 Голова</button>

<button onclick="selectPart('Шея / плечи',this)">🦴 Шея / плечи</button>

<button onclick="selectPart('Грудь',this)">🫁 Грудь</button>

<button onclick="selectPart('Живот',this)">🩺 Живот</button>

<button onclick="selectPart('Спина / поясница',this)">🔙 Спина / поясница</button>

<button onclick="selectPart('Руки',this)">💪 Руки</button>

<button onclick="selectPart('Ноги',this)">🦵 Ноги</button>

<button onclick="selectPart('Стопы',this)">🦶 Стопы</button>

</div>

<h3 style="margin-top:20px">Легенда</h3>

<div class="legend">

<div class="red">🔴 Сильная боль</div>
<div class="black">⚫ Глубокая боль</div>
<div class="blue">🔵 Волнообразная</div>
<div class="purple">🟣 Пульсация</div>
<div class="yellow">🟡 Жжение</div>
<div>• Покалывание</div>
<div>→ Распространение</div>

</div>

</section>


<section class="card">

<h2 id="bodyTitle">Голова</h2>

<div class="canvas-wrapper">

<canvas id="bodyCanvas" width="500" height="560"></canvas>

</div>

<div class="tools">

<button onclick="setTool('red')" class="active">🔴</button>
<button onclick="setTool('black')">⚫</button>
<button onclick="setTool('blue')">🔵</button>
<button onclick="setTool('purple')">🟣</button>
<button onclick="setTool('yellow')">🟡</button>
<button onclick="setTool('dot')">•</button>
<button onclick="setTool('arrow')">→</button>
<button onclick="setTool('wave')">~</button>
<button onclick="clearCanvas()">Очистить</button>

</div>

<label>
Интенсивность:
<span id="intensityValue">5</span>/10
</label>

<input type="range" min="1" max="10" value="5" oninput="changeIntensity(this.value)">

<label>Тип ощущения</label>

<select id="painType">

<option>Острая</option>
<option>Тупая</option>
<option>Пульсирующая</option>
<option>Жгучая</option>
<option>Колющая</option>
<option>Волнообразная</option>

</select>

<label>Комментарий</label>

<input id="comment" placeholder="Например: отдаёт в правую ногу">

<button class="save-btn" onclick="saveSymptom()">
Сохранить симптом
</button>

</section>


<section class="card">

<h2>Symptom Timeline</h2>

<div id="timeline">

<div class="empty">
Пока нет записей
</div>

</div>

<h3 style="margin-top:20px">
AI Symptom Summary
</h3>

<div id="summary" class="summary">

Здесь появится структурированное описание симптома.

</div>

</section>

</div>

</main>


<script>

const canvas=document.getElementById("bodyCanvas");
const ctx=canvas.getContext("2d");

let drawing=false;
let currentTool="red";
let currentPart="Голова";
let intensity=5;
let symptoms=[];


function drawBody(){

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.strokeStyle="#63708c";
ctx.fillStyle="#151e34";
ctx.lineWidth=3;

ctx.beginPath();
ctx.arc(250,110,65,0,Math.PI*2);
ctx.fill();
ctx.stroke();

ctx.fillRect(225,170,50,35);

ctx.beginPath();
ctx.roundRect(175,200,150,210,40);
ctx.fill();
ctx.stroke();

ctx.beginPath();

ctx.moveTo(180,220);
ctx.lineTo(105,370);
ctx.lineTo(130,385);

ctx.moveTo(320,220);
ctx.lineTo(395,370);
ctx.lineTo(370,385);

ctx.stroke();

ctx.beginPath();

ctx.moveTo(215,410);
ctx.lineTo(185,535);

ctx.moveTo(285,410);
ctx.lineTo(315,535);

ctx.stroke();

ctx.fillStyle="#65718d";
ctx.font="16px Arial";
ctx.textAlign="center";

ctx.fillText(
"Нарисуйте область симптома",
250,
555
);

}

drawBody();


canvas.addEventListener("mousedown",startDrawing);
canvas.addEventListener("mousemove",draw);
canvas.addEventListener("mouseup",stopDrawing);
canvas.addEventListener("mouseleave",stopDrawing);


function getPosition(e){

const rect=canvas.getBoundingClientRect();

return{

x:(e.clientX-rect.left)*(canvas.width/rect.width),

y:(e.clientY-rect.top)*(canvas.height/rect.height)

};

}


function startDrawing(e){

drawing=true;

const pos=getPosition(e);

ctx.beginPath();

ctx.moveTo(pos.x,pos.y);

}


function draw(e){

if(!drawing)return;

const pos=getPosition(e);


if(currentTool==="dot"){

ctx.fillStyle="#ffffff";

ctx.beginPath();

ctx.arc(pos.x,pos.y,5,0,Math.PI*2);

ctx.fill();

return;

}


if(currentTool==="arrow"){

drawArrow(pos.x,pos.y);

return;

}


ctx.lineWidth=currentTool==="wave"?3:15;

ctx.lineCap="round";


if(currentTool==="red")
ctx.strokeStyle="#ff4d5e";

if(currentTool==="black")
ctx.strokeStyle="#000000";

if(currentTool==="blue")
ctx.strokeStyle="#61e8ff";

if(currentTool==="purple")
ctx.strokeStyle="#b27cff";

if(currentTool==="yellow")
ctx.strokeStyle="#ffd84d";

if(currentTool==="wave"){

ctx.strokeStyle="#61e8ff";

ctx.lineWidth=4;

}


ctx.lineTo(pos.x,pos.y);

ctx.stroke();

}


function stopDrawing(){

drawing=false;

ctx.closePath();

}


function drawArrow(x,y){

ctx.strokeStyle="#ffffff";
ctx.lineWidth=4;

ctx.beginPath();

ctx.moveTo(x-35,y);
ctx.lineTo(x+25,y);

ctx.lineTo(x+12,y-10);

ctx.moveTo(x+25,y);
ctx.lineTo(x+12,y+10);

ctx.stroke();

}


function setTool(tool){

currentTool=tool;

document
.querySelectorAll(".tools button")
.forEach(button=>button.classList.remove("active"));

event.target.classList.add("active");

}


function clearCanvas(){

drawBody();

}


function changeIntensity(value){

intensity=value;

document.getElementById("intensityValue").textContent=value;

}


function selectPart(part,button){

currentPart=part;

document.getElementById("bodyTitle").textContent=part;

document
.querySelectorAll(".parts button")
.forEach(btn=>btn.classList.remove("active"));

button.classList.add("active");

clearCanvas();

}


function saveSymptom(){

const now=new Date();

const time=now.toLocaleTimeString(
"ru-RU",
{
hour:"2-digit",
minute:"2-digit"
}
);

const type=document.getElementById("painType").value;

const comment=document.getElementById("comment").value;

const record={

time:time,
part:currentPart,
intensity:intensity,
type:type,
comment:comment

};

symptoms.push(record);

updateTimeline();

generateSummary();

alert("Симптом сохранён");

}


function updateTimeline(){

const timeline=document.getElementById("timeline");

timeline.innerHTML="";

symptoms.forEach(item=>{

const div=document.createElement("div");

div.className="timeline-item";

div.innerHTML=`

<div class="timeline-time">
${item.time}
</div>

<strong>
${item.part}
</strong>

<p>
Интенсивность:
${item.intensity}/10
</p>

<p>
Тип:
${item.type}
</p>

${
item.comment
?
`<p>${item.comment}</p>`
:
""
}

`;

timeline.appendChild(div);

});

}


function generateSummary(){

if(symptoms.length===0)return;

const first=symptoms[0];

const last=symptoms[symptoms.length-1];

let progression="стабильная";


if(last.intensity>first.intensity){

progression="усиливается";

}

else if(last.intensity<first.intensity){

progression="ослабевает";

}


const summary=`

<strong>Symptom summary</strong>

<br><br>

Область:
${first.part}

<br>

Начало наблюдения:
${first.time}

<br>

Тип:
${first.type}

<br>

Начальная интенсивность:
${first.intensity}/10

<br>

Текущая интенсивность:
${last.intensity}/10

<br>

Динамика:
${progression}

<br>

Количество записей:
${symptoms.length}

${
last.comment
?
`<br><br>Дополнительно:
${last.comment}`
:
""
}

`;

document.getElementById("summary").innerHTML=summary;

}

</script>

</body>
</html>
