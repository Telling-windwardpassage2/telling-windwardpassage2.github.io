<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SymptomCanvas</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0d12;
  color: white;
}

header {
  height: 70px;
  display: flex;
  align-items: center;
  padding: 0 30px;
  border-bottom: 1px solid #242832;
  background: #10131a;
}

.logo {
  font-size: 22px;
  font-weight: 700;
}

nav {
  margin-left: auto;
  display: flex;
  gap: 10px;
}

nav button {
  background: transparent;
  color: #aaa;
  border: 0;
  padding: 10px 14px;
  cursor: pointer;
}

nav button.active,
nav button:hover {
  color: white;
}

.page {
  display: none;
  max-width: 1200px;
  margin: auto;
  padding: 35px 20px;
}

.page.active {
  display: block;
}

h1 {
  margin-top: 0;
}

.card {
  background: #131720;
  border: 1px solid #252a35;
  border-radius: 18px;
  padding: 25px;
  margin-bottom: 20px;
}

button {
  cursor: pointer;
}

.primary {
  background: white;
  color: black;
  border: 0;
  border-radius: 10px;
  padding: 13px 20px;
  font-weight: 600;
}

.areas {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 25px;
}

.area {
  background: #1b202a;
  border: 1px solid #303642;
  color: #ccc;
  border-radius: 10px;
  padding: 10px 14px;
}

.area.active {
  background: white;
  color: black;
}

.drawing-wrapper {
  display: flex;
  justify-content: center;
  background: #0e1117;
  border-radius: 16px;
  padding: 25px;
}

.body-container {
  position: relative;
  width: 300px;
  height: 560px;
  user-select: none;
  touch-action: none;
}

.body-svg {
  position: absolute;
  inset: 0;
  width: 300px;
  height: 560px;
  pointer-events: none;
}

#drawCanvas {
  position: absolute;
  left: 0;
  top: 0;
  display: block;
  width: 300px;
  height: 560px;
  z-index: 20;
  cursor: crosshair;
  touch-action: none;
  pointer-events: auto;
}

.body-part {
  fill: #343a46;
  stroke: #626a78;
  stroke-width: 2;
}

.body-part.selected {
  fill: #555d6d;
  stroke: white;
}

.controls {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 20px;
}

.tool {
  padding: 10px 15px;
  border-radius: 9px;
  border: 1px solid #303642;
  background: #1b202a;
  color: white;
}

.tool.active {
  background: white;
  color: black;
}

.form {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
  margin-top: 25px;
}

label {
  display: flex;
  flex-direction: column;
  gap: 7px;
  color: #aaa;
}

input,
select,
textarea {
  background: #0d1016;
  color: white;
  border: 1px solid #303642;
  border-radius: 9px;
  padding: 12px;
  font: inherit;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

.full {
  grid-column: 1 / -1;
}

.entry {
  background: #181c25;
  border: 1px solid #292f3b;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 10px;
}

.stat {
  font-size: 30px;
  font-weight: bold;
}

@media(max-width:700px) {
  .form {
    grid-template-columns: 1fr;
  }

  .full {
    grid-column: auto;
  }

  nav {
    display: none;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">SymptomCanvas</div>

  <nav>
    <button onclick="showPage('dashboard')" class="active">Dashboard</button>
    <button onclick="showPage('track')">Track</button>
    <button onclick="showPage('history')">History</button>
    <button onclick="showPage('insights')">Insights</button>
    <button onclick="showPage('report')">AI Report</button>
  </nav>
</header>


<!-- DASHBOARD -->

<section id="dashboard" class="page active">

  <div class="card">
    <h1>Track your symptoms</h1>
    <p>Visualize where you feel a symptom and keep a structured history.</p>
    <button class="primary" onclick="showPage('track')">
      Track symptom
    </button>
  </div>

  <div class="card">
    <div class="stat" id="totalCount">0</div>
    <div>Recorded symptoms</div>
  </div>

  <div class="card">
    <h2>Recent symptoms</h2>
    <div id="recentDashboard"></div>
  </div>

</section>


<!-- TRACK -->

<section id="track" class="page">

  <h1>Track symptom</h1>

  <div class="card">

    <h3>1. Select body area</h3>

    <div class="areas">
      <button class="area active" data-area="Head">Head</button>
      <button class="area" data-area="Neck & Shoulders">Neck & Shoulders</button>
      <button class="area" data-area="Chest">Chest</button>
      <button class="area" data-area="Abdomen">Abdomen</button>
      <button class="area" data-area="Back">Back</button>
      <button class="area" data-area="Arms">Arms</button>
      <button class="area" data-area="Legs">Legs</button>
      <button class="area" data-area="Feet">Feet</button>
    </div>

    <p>
      <b>Selected:</b>
      <span id="selectedArea">Head</span>
    </p>


    <h3>2. Draw where you feel it</h3>

    <div class="drawing-wrapper">

      <div class="body-container">

        <!-- BODY -->

        <svg class="body-svg"
             viewBox="0 0 300 560">

          <!-- head -->
          <circle
            id="head"
            class="body-part selected"
            cx="150"
            cy="55"
            r="40"/>

          <!-- neck -->
          <rect
            id="neck"
            class="body-part"
            x="132"
            y="92"
            width="36"
            height="35"
            rx="10"/>

          <!-- torso -->
          <path
            id="torso"
            class="body-part"
            d="
              M105 120
              Q150 105 195 120
              L210 260
              Q150 285 90 260
              Z"/>

          <!-- left arm -->
          <path
            id="leftArm"
            class="body-part"
            d="
              M105 125
              Q82 130 70 160
              L42 250
              Q38 265 52 270
              Q65 272 70 258
              L105 180
              Z"/>

          <!-- right arm -->
          <path
            id="rightArm"
            class="body-part"
            d="
              M195 125
              Q218 130 230 160
              L258 250
              Q262 265 248 270
              Q235 272 230 258
              L195 180
              Z"/>

          <!-- left leg -->
          <path
            id="leftLeg"
            class="body-part"
            d="
              M92 250
              L145 250
              L140 455
              Q135 475 115 475
              L105 455
              Z"/>

          <!-- right leg -->
          <path
            id="rightLeg"
            class="body-part"
            d="
              M155 250
              L208 250
              L195 455
              Q190 475 170 475
              L160 455
              Z"/>

          <!-- left foot -->
          <path
            id="leftFoot"
            class="body-part"
            d="
              M105 450
              L140 450
              L142 500
              Q120 515 92 500
              L92 475
              Z"/>

          <!-- right foot -->
          <path
            id="rightFoot"
            class="body-part"
            d="
              M160 450
              L195 450
              L208 475
              L208 500
              Q180 515 158 500
              Z"/>

        </svg>


        <!-- DRAWING CANVAS -->

        <canvas id="drawCanvas"
                width="600"
                height="1120">
        </canvas>

      </div>

    </div>


    <div class="controls">

      <button id="drawTool" class="tool active">
        ✏ Draw
      </button>

      <button id="eraseTool" class="tool">
        Eraser
      </button>

      <button id="undoTool" class="tool">
        Undo
      </button>

      <button id="clearTool" class="tool">
        Clear
      </button>

    </div>


    <div class="form">

      <label>
        Intensity (1–10)
        <input id="intensity"
               type="number"
               min="1"
               max="10"
               value="5">
      </label>

      <label>
        Symptom type
        <select id="symptomType">
          <option>Severe</option>
          <option>Deep</option>
          <option>Wave-like</option>
          <option>Pulsating</option>
          <option>Burning</option>
          <option>Tingling</option>
          <option>Radiating</option>
          <option>Other</option>
        </select>
      </label>

      <label>
        Duration
        <input id="duration"
               placeholder="e.g. 30 minutes">
      </label>

      <label>
        Frequency
        <input id="frequency"
               placeholder="e.g. twice a day">
      </label>

      <label>
        Trigger
        <input id="trigger"
               placeholder="e.g. exercise">
      </label>

      <label class="full">
        Notes
        <textarea id="notes"
                  placeholder="Anything else you want to record..."></textarea>
      </label>

    </div>

    <br>

    <button class="primary" onclick="saveSymptom()">
      Save symptom
    </button>

  </div>

</section>


<!-- HISTORY -->

<section id="history" class="page">

  <h1>History</h1>

  <div class="card">
    <div id="historyList"></div>
  </div>

</section>


<!-- INSIGHTS -->

<section id="insights" class="page">

  <h1>Insights</h1>

  <div class="card">
    <h2>Overview</h2>
    <div id="insightText"></div>
  </div>

</section>


<!-- REPORT -->

<section id="report" class="page">

  <h1>AI Report</h1>

  <div class="card">

    <div id="aiReport">
      No symptoms recorded yet.
    </div>

  </div>

</section>


<script>

const canvas = document.getElementById("drawCanvas");
const ctx = canvas.getContext("2d");

let selectedArea = "Head";
let drawing = false;
let currentTool = "draw";

let strokes = [];
let currentStroke = null;


/* -------------------------
   PAGE NAVIGATION
------------------------- */

function showPage(page) {

  document.querySelectorAll(".page")
    .forEach(p => p.classList.remove("active"));

  document.getElementById(page)
    .classList.add("active");

  document.querySelectorAll("nav button")
    .forEach(b => b.classList.remove("active"));

  const button = [...document.querySelectorAll("nav button")]
    .find(b => b.textContent.toLowerCase().replace(" ", "") === page.toLowerCase().replace(" ", ""));

  if(button) button.classList.add("active");

  refresh();
}


/* -------------------------
   BODY AREA
------------------------- */

document.querySelectorAll(".area").forEach(button => {

  button.addEventListener("click", () => {

    document.querySelectorAll(".area")
      .forEach(b => b.classList.remove("active"));

    button.classList.add("active");

    selectedArea = button.dataset.area;

    document.getElementById("selectedArea")
      .textContent = selectedArea;

    highlightBody();

    clearDrawing();
  });

});


function highlightBody() {

  document.querySelectorAll(".body-part")
    .forEach(p => p.classList.remove("selected"));

  const map = {

    "Head": ["head"],

    "Neck & Shoulders": [
      "neck",
      "leftArm",
      "rightArm"
    ],

    "Chest": ["torso"],

    "Abdomen": ["torso"],

    "Back": ["torso"],

    "Arms": [
      "leftArm",
      "rightArm"
    ],

    "Legs": [
      "leftLeg",
      "rightLeg"
    ],

    "Feet": [
      "leftFoot",
      "rightFoot"
    ]

  };

  (map[selectedArea] || [])
    .forEach(id => {
      const el = document.getElementById(id);
      if(el) el.classList.add("selected");
    });
}


/* -------------------------
   CANVAS COORDINATES
------------------------- */

function getPosition(e) {
  const rect = canvas.getBoundingClientRect();

  if (!rect.width || !rect.height) {
    return { x: 0, y: 0 };
  }

  return {
    x: (e.clientX - rect.left) * (canvas.width / rect.width),
    y: (e.clientY - rect.top) * (canvas.height / rect.height)
  };
}


/* -------------------------
   DRAWING
------------------------- */

// Reliable drawing with mouse, touch and pen
canvas.addEventListener("pointerdown", startDrawing, { passive: false });
canvas.addEventListener("pointermove", draw, { passive: false });
canvas.addEventListener("pointerup", stopDrawing, { passive: false });
canvas.addEventListener("pointercancel", stopDrawing, { passive: false });

function startDrawing(e) {
  e.preventDefault();

  if (e.pointerType === "mouse" && e.button !== 0) return;

  drawing = true;

  try {
    canvas.setPointerCapture(e.pointerId);
  } catch (_) {}

  const pos = getPosition(e);

  currentStroke = {
    points: [pos],
    tool: currentTool
  };

  strokes.push(currentStroke);

  // Draw immediately on click/tap
  drawDot(pos);
}

function draw(e) {
  if (!drawing || !currentStroke) return;

  e.preventDefault();

  const pos = getPosition(e);
  currentStroke.points.push(pos);

  redraw();
}

function stopDrawing(e) {
  if (!drawing) return;

  drawing = false;

  try {
    if (e && canvas.hasPointerCapture(e.pointerId)) {
      canvas.releasePointerCapture(e.pointerId);
    }
  } catch (_) {}

  currentStroke = null;
}

function drawDot(pos) {
  ctx.save();

  if (currentTool === "erase") {
    ctx.globalCompositeOperation = "destination-out";
    ctx.fillStyle = "rgba(0,0,0,1)";
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 22.5, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "rgba(255,255,255,0.95)";
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 7, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}


/* -------------------------
   REDRAW
------------------------- */

function redraw() {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  strokes.forEach(stroke => {

    if(stroke.points.length === 0) return;

    if(stroke.tool === "erase") {

      ctx.globalCompositeOperation =
        "destination-out";

      ctx.lineWidth = 45;

    } else {

      ctx.globalCompositeOperation =
        "source-over";

      ctx.lineWidth = 14;

    }

    ctx.strokeStyle = "rgba(255,255,255,0.95)";

    ctx.beginPath();

    ctx.moveTo(
      stroke.points[0].x,
      stroke.points[0].y
    );

    for(let i = 1; i < stroke.points.length; i++) {

      ctx.lineTo(
        stroke.points[i].x,
        stroke.points[i].y
      );

    }

    ctx.stroke();

  });

  ctx.globalCompositeOperation =
    "source-over";

}


/* -------------------------
   TOOLS
------------------------- */

document.getElementById("drawTool")
  .addEventListener("click", () => {

    currentTool = "draw";

    document.getElementById("drawTool")
      .classList.add("active");

    document.getElementById("eraseTool")
      .classList.remove("active");

  });


document.getElementById("eraseTool")
  .addEventListener("click", () => {

    currentTool = "erase";

    document.getElementById("eraseTool")
      .classList.add("active");

    document.getElementById("drawTool")
      .classList.remove("active");

  });


document.getElementById("undoTool")
  .addEventListener("click", () => {

    strokes.pop();

    redraw();

  });


document.getElementById("clearTool")
  .addEventListener("click", clearDrawing);


function clearDrawing() {

  strokes = [];

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

}


/* -------------------------
   SAVE
------------------------- */

function saveSymptom() {

  const entry = {

    area: selectedArea,

    intensity:
      Number(document.getElementById("intensity").value),

    type:
      document.getElementById("symptomType").value,

    duration:
      document.getElementById("duration").value,

    frequency:
      document.getElementById("frequency").value,

    trigger:
      document.getElementById("trigger").value,

    notes:
      document.getElementById("notes").value,

    date:
      new Date().toLocaleString(),

    drawing:
      JSON.parse(JSON.stringify(strokes))

  };


  const data =
    JSON.parse(localStorage.getItem("symptoms") || "[]");

  data.unshift(entry);

  localStorage.setItem(
    "symptoms",
    JSON.stringify(data)
  );


  alert("Symptom saved.");

  clearForm();

  refresh();

}


function clearForm() {

  document.getElementById("intensity").value = 5;
  document.getElementById("duration").value = "";
  document.getElementById("frequency").value = "";
  document.getElementById("trigger").value = "";
  document.getElementById("notes").value = "";

  clearDrawing();

}


/* -------------------------
   DATA
------------------------- */

function getData() {

  return JSON.parse(
    localStorage.getItem("symptoms") || "[]"
  );

}


function refresh() {

  const data = getData();

  document.getElementById("totalCount")
    .textContent = data.length;


  /* recent */

  const recent =
    document.getElementById("recentDashboard");

  if(data.length === 0) {

    recent.innerHTML =
      "<p>No symptoms recorded yet.</p>";

  } else {

    recent.innerHTML =
      data.slice(0, 5)
      .map(e => `
        <div class="entry">
          <b>${safe(e.area)}</b>
          <br>
          Intensity: ${e.intensity}/10
          <br>
          ${safe(e.type)}
          <br>
          <small>${safe(e.date)}</small>
        </div>
      `)
      .join("");

  }


  /* history */

  const history =
    document.getElementById("historyList");

  if(data.length === 0) {

    history.innerHTML =
      "<p>No history yet.</p>";

  } else {

    history.innerHTML =
      data.map(e => `

        <div class="entry">

          <b>${safe(e.area)}</b>

          <br>
          Intensity:
          ${e.intensity}/10

          <br>
          Type:
          ${safe(e.type)}

          <br>
          Duration:
          ${safe(e.duration || "Not specified")}

          <br>
          Frequency:
          ${safe(e.frequency || "Not specified")}

          <br>
          Trigger:
          ${safe(e.trigger || "Not specified")}

          <br>
          Notes:
          ${safe(e.notes || "None")}

          <br><br>

          <small>${safe(e.date)}</small>

        </div>

      `).join("");

  }


  /* insights */

  if(data.length === 0) {

    document.getElementById("insightText")
      .textContent = "Not enough data yet.";

  } else {

    const avg =
      data.reduce(
        (sum, e) => sum + Number(e.intensity),
        0
      ) / data.length;

    document.getElementById("insightText")
      .innerHTML = `
        Recorded symptoms: <b>${data.length}</b><br>
        Average intensity: <b>${avg.toFixed(1)}/10</b><br>
        Most recent area: <b>${safe(data[0].area)}</b>
      `;

  }


  /* AI report */

  generateReport(data);

}


function generateReport(data) {

  const box =
    document.getElementById("aiReport");

  if(data.length === 0) {

    box.innerHTML =
      "No symptoms recorded yet.";

    return;

  }


  const latest = data[0];

  const average =
    data.reduce(
      (sum, e) => sum + Number(e.intensity),
      0
    ) / data.length;


  const max =
    Math.max(
      ...data.map(e => Number(e.intensity))
    );


  box.innerHTML = `

    <h2>Structured Symptom Summary</h2>

    <p>
      <b>Latest recorded area:</b>
      ${safe(latest.area)}
    </p>

    <p>
      <b>Intensity:</b>
      ${latest.intensity}/10
    </p>

    <p>
      <b>Symptom type:</b>
      ${safe(latest.type)}
    </p>

    <p>
      <b>Duration:</b>
      ${safe(latest.duration || "Not specified")}
    </p>

    <p>
      <b>Frequency:</b>
      ${safe(latest.frequency || "Not specified")}
    </p>

    <p>
      <b>Trigger:</b>
      ${safe(latest.trigger || "Not specified")}
    </p>

    <p>
      <b>Average recorded intensity:</b>
      ${average.toFixed(1)}/10
    </p>

    <p>
      <b>Highest recorded intensity:</b>
      ${max}/10
    </p>

    <p>
      <b>Number of records:</b>
      ${data.length}
    </p>

    <hr>

    <p>
      This report organizes information provided by
      the user. It does not diagnose a medical condition.
    </p>

  `;

}


/* -------------------------
   SECURITY
------------------------- */

function safe(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* -------------------------
   START
------------------------- */

highlightBody();
refresh();

</script>

</body>
</html>
